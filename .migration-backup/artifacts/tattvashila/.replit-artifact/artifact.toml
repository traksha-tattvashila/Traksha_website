kind = "web"
previewPath = "/"
title = "Tattvashila"
version = "1.0.0"
id = "artifacts/tattvashila"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19271

[services.development]
run = "pnpm --filter @workspace/tattvashila run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tattvashila", "run", "build" ]
publicDir = "artifacts/tattvashila/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19271"
BASE_PATH = "/"
